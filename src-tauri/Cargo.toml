[package]
name = "pos-agent"
version = "0.6.0"
description = "Agen PC kasir POS: layar pelanggan di monitor kedua dan pengumuman suara"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.26"
sys-locale = "0.3.2"
tts = "0.26"
sherpa-onnx = "2.0.1"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
hound = "3"
ureq = "2"
tar = "0.4"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }

[profile.release]
strip = true
opt-level = "s"


# Linux: putar lewat PulseAudio/PipeWire langsung (pure Rust). Plugin ALSA "default" ke PipeWire
# sering melempar EIO di snd_pcm_avail_delay; bila server Pulse tidak ada cpal kembali ke ALSA.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
