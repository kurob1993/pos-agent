[package]
name = "layar-pelanggan"
version = "0.1.0"
description = "Layar pelanggan POS di monitor kedua"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.26"

[profile.release]
strip = true
opt-level = "s"
