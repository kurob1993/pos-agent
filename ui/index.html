<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>Layar Pelanggan</title>
<link rel="stylesheet" href="ui.css">
<body style="display:grid;place-items:center;height:100vh;text-align:center">
  <div>
    <h1 id="title" style="margin:0 0 8px;font-size:40px;font-weight:600;letter-spacing:-.02em">Selamat datang</h1>
    <p id="sub" class="muted" style="margin:0;font-size:20px">Menunggu kasir membuka POS…</p>
  </div>
  <script>
    if (!navigator.language.toLowerCase().startsWith('id')) {
      document.getElementById('title').textContent = 'Welcome';
      document.getElementById('sub').textContent = 'Waiting for the cashier to open the POS…';
    }
  </script>
</body>
</html>
