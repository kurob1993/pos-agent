<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>POS Agent</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  #list { display: grid; gap: 8px; margin: 16px 0; }
  .option { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; }
  .option:has(input:checked) { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .option b { font-weight: 500; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
<body>
<main>
  <h1 id="title"></h1>
  <p id="sub" class="muted" style="margin:0"></p>
  <div id="list"></div>
  <div class="actions">
    <button id="skip" class="btn btn-outline"></button>
    <button id="ok" class="btn"></button>
  </div>
</main>
<script>
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  const T = {
    id: { title: 'Tampilkan layar pelanggan di mana?', sub: 'Otomatis memilih dalam {n} detik.', ok: 'Tampilkan', skip: 'Jangan tampilkan', primary: 'utama' },
    en: { title: 'Where to show the customer display?', sub: 'Choosing automatically in {n} seconds.', ok: 'Show', skip: "Don't show", primary: 'primary' },
  };
  let seconds = 15, timer;
  const pick = (key) => { clearInterval(timer); invoke('pick_monitor', { key }); };

  invoke('picker_data').then(({ monitors, selected, lang }) => {
    const t = T[lang];
    $('title').textContent = t.title;
    $('ok').textContent = t.ok;
    $('skip').textContent = t.skip;
    monitors.forEach((m, i) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.innerHTML = `<input type="radio" name="m"><span><b></b><br><span class="muted"></span></span>`;
      const radio = label.querySelector('input');
      radio.value = m.key;
      radio.checked = m.key === selected;
      label.querySelector('b').textContent = `${i + 1}. ${m.key}`;
      label.querySelector('.muted').textContent = `${m.width}×${m.height}${m.primary ? ` · ${t.primary}` : ''}`;
      radio.onchange = () => { clearInterval(timer); $('sub').textContent = ''; };
      $('list').append(label);
    });
    const tick = () => {
      if (seconds === 0) return $('ok').click();
      $('sub').textContent = t.sub.replace('{n}', seconds--);
    };
    tick();
    timer = setInterval(tick, 1000);
  });
  $('ok').onclick = () => {
    const checked = document.querySelector('input[name=m]:checked');
    pick(checked ? checked.value : null);
  };
  $('skip').onclick = () => pick(null);
</script>
</body>
</html>
